<!doctype html>
<html>
<head>
    <script src="https://aframe.io"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        id="scene"
        embedded
        gesture-detector
    >
        <a-assets>
            <a-asset-item id="klee-asset" src="assets/KLEE/asset.glb"></a-asset-item>
            <a-asset-item id="fufu-asset" src="assets/FUFU/asset.glb"></a-asset-item>
        </a-assets>

        <a-marker
            id="marker-klee"
            type="pattern"
            preset="custom"
            url="assets/KLEEmarker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
        <a-entity id="klee-model-entity" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#klee-asset" class="clickable" gesture-handler></a-entity>    
        </a-marker>

        <a-marker
            id="marker-fufu"
            type="pattern"
            preset="custom"
            url="assets/FUFUmarker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
        <a-entity id="fufu-model-entity" scale="1 1 1" animation-mixer="loop: repeat" gltf-model="#fufu-asset" class="clickable" gesture-handler></a-entity>    
        </a-marker>

        
    </a-scene>
</body>
</html>
